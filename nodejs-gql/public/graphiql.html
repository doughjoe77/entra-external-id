<!DOCTYPE html>
<html>
  <head>
    <title>GraphiQL + Explorer</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/graphiql@3.0.0/graphiql.min.css"
    />
    <link rel="stylesheet" href="/public/treeview.css" />

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/graphiql@3.0.0/graphiql.min.js"></script>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        font-family: system-ui, sans-serif;
      }
      #builder {
        width: 320px;
        border-right: 1px solid #ccc;
        overflow: auto;
        padding: 8px;
      }
      #args-panel {
        width: 200px;
        border-left: 1px solid #ccc;
        padding: 8px;
        overflow: auto;
      }
      #graphiql {
        flex: 1;
      }
      #toolbar {
        display: flex;
        gap: 8px;
        padding: 8px;
        border-bottom: 1px solid #ccc;
      }
      /* button {
        padding: 4px 8px;
        font-size: 13px;
        cursor: pointer;
      } */
    </style>
  </head>

  <body>
    <div id="builder"></div>

    <!-- <button id="reset-btn">Reset Query</button>
    <button id="copy-btn">Copy Query</button> -->

    <div id="graphiql"></div>

    <script type="module" src="/public/query-builder.js"></script>
    <script type="module" src="/public/schema-and-tree.js"></script>
    <script type="module" src="/public/graphiql.js"></script>
  </body>
</html>
