<!DOCTYPE html>
<html>
<head>
    <title>GraphQL Explorer</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/graphiql@3.0.0/graphiql.min.css" />

    <link rel="stylesheet" href="/public/graphiql.css" />
    <link rel="stylesheet" href="/public/treeview.css" />
    <link rel="stylesheet" href="/public/style.css" />

    <script src="/graphiql/config.js"></script>
</head>

<body>

<header class="app-header">
    <div class="header-title">GraphQL Explorer</div>
    <button id="logoutBtn" class="logout-button">Logout</button>
</header>

<div id="layout">

    <div id="builder"></div>

    <div id="graphiql"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/graphiql@3.0.0/graphiql.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<script type="module" src="/public/graphiql.js"></script>

<script>
    // -------------------------------------------------------
    // MSAL configuration
    // -------------------------------------------------------
    const msalConfig = {
        auth: {
            clientId: window.appConfig.clientId,
            authority: window.appConfig.authority,
            redirectUri: window.appConfig.redirectUri
        },
        cache: {
            cacheLocation: "localStorage",
            storeAuthStateInCookie: false
        }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    const tokenRequest = {
        scopes: [window.appConfig.apiScope]
    };

    let accessToken = null;

    // -------------------------------------------------------
    // Rolling inactivity logout
    // -------------------------------------------------------
    let logoutTimer = null;

    function startAutoLogout() {
        const minutes = parseInt(window.appConfig.logoutMinutes, 10);
        const ms = minutes * 60 * 1000;

        if (logoutTimer) clearTimeout(logoutTimer);

        logoutTimer = setTimeout(() => {
            msalInstance.logoutRedirect({
                postLogoutRedirectUri: window.location.origin + "/public/logout.html"
            });
        }, ms);
    }

    function enableActivityReset() {
        ["click", "keydown", "mousemove", "scroll"].forEach(evt => {
            document.addEventListener(evt, startAutoLogout);
        });
    }

    // -------------------------------------------------------
    // Logout button
    // -------------------------------------------------------
    document.getElementById("logoutBtn").onclick = () => {
        const account = msalInstance.getActiveAccount();
        msalInstance.logoutRedirect({
            account,
            postLogoutRedirectUri: window.location.origin + "/public/logout.html"
        });
    };

    // -------------------------------------------------------
    // Handle MSAL redirect login
    // -------------------------------------------------------
    msalInstance.handleRedirectPromise().then(async (result) => {

        if (result && result.accessToken) {
            accessToken = result.accessToken;
            startAutoLogout();
            enableActivityReset();
            startGraphiQLWithAuth();
            startWebSocketAuth();
            return;
        }

        const accounts = msalInstance.getAllAccounts();

        if (accounts.length === 0) {
            msalInstance.loginRedirect(tokenRequest);
            return;
        }

        try {
            const silent = await msalInstance.acquireTokenSilent({
                ...tokenRequest,
                account: accounts[0]
            });

            accessToken = silent.accessToken;
            startAutoLogout();
            enableActivityReset();
            startGraphiQLWithAuth();
            startWebSocketAuth()
        }
        catch (err) {
            msalInstance.loginRedirect(tokenRequest);
        }
    });

    // -------------------------------------------------------
    // Inject Authorization header into your existing fetcher
    // -------------------------------------------------------
    function startGraphiQLWithAuth() {
        // Patch global fetch to inject Authorization header
        const originalFetch = window.fetch;

        window.fetch = function(url, options = {}) {
            options.headers = options.headers || {};
            options.headers["Authorization"] = "Bearer " + accessToken;
            return originalFetch(url, options);
        };

        // Now load your tree + GraphiQL UI
        import("/public/graphiql.js");
    }

    function startWebSocketAuth() {
        const token = window.accessToken;

        if (!token) {
            console.warn("[WS AUTH] No access token available when patching WS auth");
        }

        // Wrap graphql-ws createClient so every WS client gets the JWT
        const originalCreateClient = window.graphqlWs.createClient;

        window.graphqlWs.createClient = function patchedCreateClient(options = {}) {
            const authHeader = "Bearer " + token;

            const patchedOptions = {
                ...options,
                connectionParams: () => {
                    return {
                        ...(typeof options.connectionParams === "function"
                            ? options.connectionParams()
                            : options.connectionParams || {}),
                        Authorization: authHeader
                    };
                }
            };

            console.log("[WS AUTH] Injecting Authorization:", authHeader);
            return originalCreateClient(patchedOptions);
        };
    }

</script>
</body>
</html>
